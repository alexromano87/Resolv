# Nginx Reverse Proxy Configuration for Resolv Production
# Handles resolv.legal + checkup.resolv.legal

upstream backend {
    # Load balancing with multiple backend instances
    least_conn;
    server backend:3000 max_fails=3 fail_timeout=30s;
    keepalive 16;
    # Add more instances for horizontal scaling:
    # server backend2:3000 max_fails=3 fail_timeout=30s;
    # server backend3:3000 max_fails=3 fail_timeout=30s;
}

# Hide nginx version
server_tokens off;

# Real IP from Cloudflare (uses CF-Connecting-IP, fallback to remote addr)
map $http_cf_connecting_ip $real_client_ip {
    default $http_cf_connecting_ip;
    ""      $binary_remote_addr;
}

# Rate limiting zones (keyed by real user IP, not Cloudflare proxy IP)
limit_req_zone $real_client_ip zone=general:10m rate=100r/m;
limit_req_zone $real_client_ip zone=login:10m rate=5r/m;
limit_req_zone $real_client_ip zone=api:10m rate=120r/m;
limit_req_zone $real_client_ip zone=presence:10m rate=120r/m;

# Connection limiting
limit_conn_zone $real_client_ip zone=addr:10m;

# Return 429 (Too Many Requests) instead of 503 when rate/conn limits are hit
limit_req_status 429;
limit_conn_status 429;

# Redirect HTTP to HTTPS (both domains)
server {
    listen 80;
    listen [::]:80;
    server_name resolv.legal www.resolv.legal checkup.resolv.legal;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# HTTPS - Main App (resolv.legal)
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name resolv.legal www.resolv.legal;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/resolv.legal/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/resolv.legal/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/resolv.legal/chain.pem;

    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP: compiled React/Vite bundles do not need 'unsafe-inline' in script-src
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' wss:; object-src 'none'; frame-ancestors 'none'; base-uri 'self';" always;
    # CSP Report-Only: monitor violations without blocking (passive detection)
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' wss:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; report-uri /api/csp-report;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Logging
    access_log /var/log/nginx/resolv_access.log;
    error_log /var/log/nginx/resolv_error.log;

    # Max upload size (for document uploads)
    client_max_body_size 50M;
    client_body_timeout 300s;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # Frontend - Serve static files
    location / {
        root /var/www/resolv/frontend;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # No cache for index.html
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # Backend API
    location /api {
        # Rewrite /api/* to /*
        rewrite ^/api(/.*)$ $1 break;

        # Rate limiting
        limit_req zone=api burst=60 nodelay;
        limit_conn addr 30;

        # Proxy settings
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Retry on upstream failures
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 15s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Health check endpoint (no rate limit)
    location /api/health {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Strict rate limiting for auth endpoints
    location /api/auth/login {
        rewrite ^/api(/.*)$ $1 break;
        limit_req zone=login burst=2 nodelay;
        limit_conn addr 5;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File downloads (larger timeout)
    location ~ ^/api/(backup/download|export) {
        rewrite ^/api(/.*)$ $1 break;
        limit_req zone=api burst=5 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeout for large file downloads
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Custom error page for backend unavailable
    error_page 502 503 /api_unavailable.json;
    location = /api_unavailable.json {
        internal;
        default_type application/json;
        return 503 '{"message":"Servizio temporaneamente non disponibile, riprova tra qualche secondo","error":"Service Unavailable","statusCode":503}';
    }

    # Nginx health check
    location = /health {
        access_log off;
        return 200 "ok";
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(\.env|package\.json|docker-compose\.yml|README\.md) {
        deny all;
    }
}

# =============================================================================
# HTTPS - Checkup App (checkup.resolv.legal)
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name checkup.resolv.legal;

    # SSL Configuration (same cert, must cover both domains)
    ssl_certificate /etc/letsencrypt/live/resolv.legal/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/resolv.legal/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/resolv.legal/chain.pem;

    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP: compiled React/Vite bundles do not need 'unsafe-inline' in script-src
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' wss:; object-src 'none'; frame-ancestors 'none'; base-uri 'self';" always;
    # CSP Report-Only: monitor violations without blocking (passive detection)
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' wss:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; report-uri /api/csp-report;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Logging (separate logs for checkup)
    access_log /var/log/nginx/checkup_access.log;
    error_log /var/log/nginx/checkup_error.log;

    # Max upload size
    client_max_body_size 50M;
    client_body_timeout 300s;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # Redirect root to /checkup/ for convenience
    location = / {
        return 301 /checkup/;
    }

    # Redirect /checkup (no trailing slash) to /checkup/
    location = /checkup {
        return 301 /checkup/;
    }

    # Checkup frontend (sub-app at /checkup/)
    location /checkup/ {
        alias /var/www/resolv/checkup-frontend/;
        try_files $uri $uri/ /checkup/index.html;

        # Cache static assets
        location ~* ^/checkup/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # No cache for index.html
        location = /checkup/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # Serve public assets at root level (logo referenced with absolute path in frontend)
    location = /logo_resolv.png {
        alias /var/www/resolv/checkup-frontend/logo_resolv.png;
    }

    # Presence endpoints – dedicated higher rate limit (polling endpoint)
    location ~ ^/api/checkup/preassessment/[^/]+/presence {
        rewrite ^/api(/.*)$ $1 break;
        limit_req zone=presence burst=40 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        access_log off;
    }

    # Backend API proxy
    location /api {
        rewrite ^/api(/.*)$ $1 break;

        # Rate limiting
        limit_req zone=api burst=60 nodelay;
        limit_conn addr 30;

        # Proxy settings
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Retry on upstream failures
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 15s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Health check endpoint (no rate limit)
    location /api/health {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Rate limiting for checkup auth login
    location /api/checkup/auth/login {
        rewrite ^/api(/.*)$ $1 break;
        limit_req zone=login burst=2 nodelay;
        limit_conn addr 5;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Custom error page for backend unavailable
    error_page 502 503 /api_unavailable.json;
    location = /api_unavailable.json {
        internal;
        default_type application/json;
        return 503 '{"message":"Servizio temporaneamente non disponibile, riprova tra qualche secondo","error":"Service Unavailable","statusCode":503}';
    }

    # Nginx health check
    location = /health {
        access_log off;
        return 200 "ok";
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(\.env|package\.json|docker-compose\.yml|README\.md) {
        deny all;
    }
}
